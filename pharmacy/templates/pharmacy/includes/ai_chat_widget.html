{% load static %}
<div class="ai-chat-widget" style="background:#fff; border-radius:24px; box-shadow:0 8px 20px rgba(0,0,0,0.08); padding:20px; margin:30px 0; border:1px solid rgba(30,58,95,0.1);">
    <h3 style="color:#1e3a5f; display:flex; align-items:center; gap:10px;">
        <i class="fas fa-robot"></i> Pharmacy AI Assistant
    </h3>
    <div id="chat-messages" style="max-height:300px; overflow-y:auto; background:#f8fafc; border-radius:16px; padding:15px; margin-bottom:15px;">
        <div class="ai-message">Hello! I'm your pharmacy assistant. Ask me about medications, health tips, or our products.</div>
    </div>
    <form id="chat-form" style="display:flex; gap:10px;">
        {% csrf_token %}
        <input type="text" id="chat-input" placeholder="Type your question..." style="flex:1; padding:12px; border:1px solid #cbd5e1; border-radius:40px;">
        <button type="submit" style="background:#1e3a5f; color:white; border:none; padding:0 20px; border-radius:40px; font-weight:500; cursor:pointer;">Send</button>
    </form>
</div>
<script>
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const question = chatInput.value.trim();
        if (!question) return;
        // Add user message to chat
        const userDiv = document.createElement('div');
        userDiv.className = 'user-message';
        userDiv.style.textAlign = 'right';
        userDiv.style.margin = '10px 0';
        userDiv.innerHTML = `<span style="background:#1e3a5f; color:white; display:inline-block; padding:8px 16px; border-radius:30px;">${escapeHtml(question)}</span>`;
        chatMessages.appendChild(userDiv);
        chatInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Show loading indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'ai-message';
        loadingDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Thinking...';
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Send to backend
        const response = await fetch('{% url "ask_ai" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}',
            },
            body: JSON.stringify({ question: question }),
        });
        const data = await response.json();
        loadingDiv.remove();
        const aiDiv = document.createElement('div');
        aiDiv.className = 'ai-message';
        aiDiv.style.margin = '10px 0';
        aiDiv.innerHTML = `<span style="background:#eef5ea; color:#1e3a5f; display:inline-block; padding:8px 16px; border-radius:30px;">${escapeHtml(data.answer)}</span>`;
        chatMessages.appendChild(aiDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
