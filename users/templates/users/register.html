{% extends 'base.html' %}

{% block content %}
<style>
    /* same inline CSS as above (copy the entire <style> block) */
    .auth-container {
        max-width: 480px;
        margin: 2rem auto;
        padding: 2rem 1.5rem;
        background: white;
        border-radius: 32px;
        box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
        border: 1px solid rgba(30,58,95,0.1);
    }
    .auth-container h1 {
        text-align: center;
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        color: #1e3a5f;
    }
    .auth-container label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.4rem;
        color: #1e3a5f;
    }
    .auth-container input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 28px;
        background: white;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
    }
    .auth-container input:focus {
        outline: none;
        border-color: #1e3a5f;
        box-shadow: 0 0 0 3px rgba(30,58,95,0.2);
    }
    .auth-container .form-error {
        color: #c2410c;
        font-size: 0.8rem;
        margin-top: -0.2rem;
        margin-bottom: 0.5rem;
        padding-left: 12px;
        border-left: 3px solid #c2410c;
        background: #fff4ed;
        border-radius: 12px;
        padding: 4px 12px;
    }
    .auth-container button {
        width: 100%;
        background: #1e3a5f;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 40px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 0.5rem;
    }
    .auth-container button:hover {
        background: #14324f;
    }
    .auth-container a {
        color: #1e3a5f;
        text-decoration: none;
        font-weight: 500;
    }
    .auth-container a:hover {
        text-decoration: underline;
    }
</style>

<div class="auth-container">
    <h1>Create Account</h1>
  <form method="post">
    {% csrf_token %}
    <div class="form-error">{{ form.non_field_errors }}</div>
    {% for f in form %}
        <p>
            <label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}:</label>
            {{ f }}
        </p>
        <div class="form-error">{{ f.errors }}</div>
    {% endfor %}
    <button type="submit">Register</button>
</form>
    <p style="text-align: center; margin-top: 1.5rem;">
        Already have an account? <a href="{% url 'users:login' %}">Log in</a>
    </p>
</div>
{% endblock %}
