{% extends 'base.html' %}

{% block title %}Reset Link Sent{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 480px;
        margin: 2rem auto;
        padding: 2rem 1.5rem;
        background: white;
        border-radius: 32px;
        box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
        text-align: center;
    }
    .auth-container h1 {
        color: #1e3a5f;
        margin-bottom: 1rem;
    }
    .auth-container a {
        color: #1e3a5f;
        font-weight: 500;
        text-decoration: none;
    }
    .auth-container a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Check your email</h1>
    <p>We've sent you a link to reset your password. Please check your inbox.</p>
    <p><a href="{% url 'users:login' %}">Back to login</a></p>
</div>
{% endblock %}
